<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .subtitle { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .th { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .td { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .ok { fill: #166534; }
      .mask { fill: #b91c1c; }
      .grid { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .chip { font: 700 15px 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="640" fill="url(#bg2)"/>
  <text x="60" y="62" class="title">Tier and Privacy Visibility Matrix</text>
  <text x="60" y="92" class="subtitle">How identifiers are displayed in /investigate reports</text>

  <rect class="grid" x="60" y="140" width="1080" height="430" rx="12"/>

  <line x1="60" y1="220" x2="1140" y2="220" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="320" y1="140" x2="320" y2="570" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="590" y1="140" x2="590" y2="570" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="860" y1="140" x2="860" y2="570" stroke="#cbd5e1" stroke-width="2"/>

  <text x="95" y="188" class="th">Input Combination</text>
  <text x="380" y="188" class="th">Basic</text>
  <text x="655" y="188" class="th">Pro</text>
  <text x="930" y="188" class="th">Master</text>

  <text x="95" y="280" class="td">privacy:off + IP/MAC/Social</text>
  <text x="380" y="280" class="td mask">Masked</text>
  <text x="655" y="280" class="td ok">Real</text>
  <text x="930" y="280" class="td ok">Real</text>

  <text x="95" y="360" class="td">privacy:on + IP/MAC/Social</text>
  <text x="380" y="360" class="td mask">Masked</text>
  <text x="655" y="360" class="td mask">Masked</text>
  <text x="930" y="360" class="td mask">Masked</text>

  <text x="95" y="440" class="td">consent:no identity enrichment</text>
  <text x="380" y="440" class="td mask">Redacted</text>
  <text x="655" y="440" class="td mask">Redacted</text>
  <text x="930" y="440" class="td mask">Redacted</text>

  <text x="95" y="520" class="td">tracking behavior</text>
  <text x="380" y="520" class="td ok">Disabled</text>
  <text x="655" y="520" class="td ok">Disabled</text>
  <text x="930" y="520" class="td ok">Disabled</text>
</svg>
